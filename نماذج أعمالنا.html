    <header class="pb-4">
      <section id="heder" class="py-5 text-center">
        <h1 class="fw-bold display-5">

          تصاميم سوشال ميديا
        </h1>
      </section>
      <div id="Card" class="container">
        <div class="hero-wrap">
          <!-- Carousel -->
          <div
            id="mainCarousel"
            class="carousel slide mt-4 overflow-hidden"
            data-bs-ride="carousel"
          >
            <!-- Indicators -->
            <div class="carousel-indicators">
              <!-- Button for Slide 1 \\\  زر السلايد الأول   -->
              <button
                type="button"
                data-bs-target="#mainCarousel"
                data-bs-slide-to="0"
                aria-current="true"
                class="active"
                aria-label="slide 1"
              >
                تصميم جرافيك
              </button>
              <!-- Button for Slide 2  \\\  زر السلايد الثاني  -->
              <button
                type="button"
                data-bs-target="#mainCarousel"
                data-bs-slide-to="1"
                aria-label="slide 2"
              >
                سوشيال ميديا
              </button>
              <!-- Button for Slide 3 \\\   زر السلايد الثالث  -->
              <button
                type="button"
                data-bs-target="#mainCarousel"
                data-bs-slide-to="2"
                aria-label="slide 3"
              >
                تحليل البيانات
              </button>
            </div>
            <!-- Slides \\\   قسم السلاسيد والصور  -->
            <!-- Slides 1  \\\   قسم صورة 1 -->
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  class="d-block w-100 rounded-4 carousel-img"
                  src="graphic.png"
                  alt="Slide 1"
                  style="height: 400px; object-fit: cover"
                />
              </div>
              <!-- Slides 2  \\\   قسم صورة 2 -->
              <div class="carousel-item">
                <img
                  class="d-block w-100 rounded-4 carousel-img"
                  src="social.png"
                  alt="Slide 2"
                  style="height: 400px; object-fit: cover"
                />
              </div>
              <!-- Slides 3  \\\   قسم صورة 3 -->
              <div class="carousel-item">
                <img
                  class="d-block w-100 rounded-4 carousel-img"
                  src="data.png"
                  alt="Slide 3"
                  style="height: 400px; object-fit: cover"
                />
              </div>
            </div>

            <!-- Controls \\\ أزرار التحكم بالكاروسيل السابق  و التالي-->
            <!-- prev \\\ السابق -->
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#mainCarousel"
              data-bs-slide="prev"
            >
              <span class="carousel-control-prev-icon"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <!-- next \\\ التالي  -->
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#mainCarousel"
              data-bs-slide="next"
            >
              <span class="carousel-control-next-icon"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
      </div>
    </header>
